name: lideh_live_flutter
description: "LiDeH Live — Gospel musician & event booking platform (Flutter + Firebase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4

  # UI / UX
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  flutter_rating_bar: ^4.0.1
  file_picker: ^8.0.6

  # Utilities
  uuid: ^4.4.2
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
